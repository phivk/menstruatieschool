name: Trigger Vercel Deploy

on:
  push:
    branches: [main] # adjust to your branch name

jobs:
  retrigger:
    runs-on: ubuntu-latest
    # Only run when the push was NOT already from your account
    if: github.actor != 'phivk'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Configure git as you
        run: |
          git config user.name "Philo van Kemenade"
          git config user.email "philovankemenade@gmail.com"

      - name: Make an empty commit
        run: |
          git commit --allow-empty -m "chore: trigger deploy [skip ci if not needed]"
          git push
