label: Onze missie
headline: |-
  Kennis die jou
  in je kracht zet
body:
  - >-
    Een groot deel van de last die menstruerende personen ervaren blijft onnodig
    lang onzichtbaar — door taboe, een gebrek aan kwalitatieve educatie en het
    normaliseren van klachten.
  - >-
    Met De MenstruatieSchool bieden we toepasbare kennis die taboes doorbreekt.
    Op korte termijn meer rust en zelfvertrouwen. Op lange termijn betere
    gezondheid en emancipatie.
linkLabel: Meer over ons →
values:
  - title: Laagdrempelig
    description: Workshops in je eigen buurt, voor iedereen.
  - title: Kwalitatief
    description: Onderbouwde kennis, geen hype of taboe.
  - title: Verbindend
    description: Meer taal, meer begrip, meer ruimte voor steun.
