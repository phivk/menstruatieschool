label: Onze missie
headline: |-
  Kennis die jou
  in je kracht zet
body:
  - >-
    Een groot deel van de last die menstruerende personen ervaren blijft onnodig
    lang onzichtbaar, door taboe, normalisering van klachten en een gebrek aan
    kwalitatieve educatie. 
  - >-
    Met De MenstruatieSchool bieden we toepasbare kennis die inzicht geeft in de
    taal van het cyclische lichaam. Een belangrijke stap voor een sterke positie
    en goede gezondheid van vrouwen. Op lange termijn essentieel voor
    emancipatie.  
values:
  - title: Laagdrempelig
