<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>De MenstruatieSchool — Website UI Kit</title>
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@200;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "RedHatText";
        src: url("../../fonts/RedHatText-Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Barlow";
        src: url("../../fonts/Barlow-Light.ttf") format("truetype");
        font-weight: 300;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: #fff;
        font-family: "RedHatText", sans-serif;
        color: #1a1410;
        -webkit-font-smoothing: antialiased;
      }
      button {
        cursor: pointer;
        font-family: inherit;
      }
      input,
      textarea,
      select {
        font-family: inherit;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      // ── Tokens ───────────────────────────────────────────────────
      const C = {
        vermilion: "#D42818",
        vermilionDark: "#A81F11",
        vermilionMist: "#FDF0EE",
        blush: "#E8908A",
        blushDark: "#C4685E",
        blushMist: "#FDF5F4",
        amber: "#F0A820",
        amberDark: "#C8860A",
        amberMist: "#FEF8E6",
        charcoal: "#1A1410",
        charcoalMid: "#3A3330",
        muted: "#7A706A",
        border: "#EBEBEB",
        white: "#FFFFFF",
        offWhite: "#F8F7F5",
      };

      // ── Data ─────────────────────────────────────────────────────
      const WORKSHOPS = [
        {
          id: 1,
          title: "Cyclus & energie",
          type: "Workshop",
          date: "12 mei",
          location: "Amsterdam Oost",
          spots: 8,
          accentBg: C.amberMist,
          accentColor: C.amberDark,
          dot: C.amber,
          tag: "Beschikbaar",
        },
        {
          id: 2,
          title: "Hormonen & voeding",
          type: "Online",
          date: "26 mei",
          location: "Online (live)",
          spots: 3,
          accentBg: C.blushMist,
          accentColor: C.blushDark,
          dot: C.blush,
          tag: "Laatste plekken",
        },
        {
          id: 3,
          title: "Menstruatie & werk",
          type: "Workshop",
          date: "3 juni",
          location: "Utrecht Centrum",
          spots: 0,
          accentBg: C.offWhite,
          accentColor: C.muted,
          dot: "#ccc",
          tag: "Volgeboekt",
        },
        {
          id: 4,
          title: "De vier fases",
          type: "Workshop",
          date: "17 juni",
          location: "Den Haag",
          spots: 12,
          accentBg: C.amberMist,
          accentColor: C.amberDark,
          dot: C.amber,
          tag: "Beschikbaar",
        },
        {
          id: 5,
          title: "Tieners & cyclus",
          type: "Workshop",
          date: "24 juni",
          location: "Amsterdam Noord",
          spots: 6,
          accentBg: C.blushMist,
          accentColor: C.blushDark,
          dot: C.blush,
          tag: "Beschikbaar",
        },
        {
          id: 6,
          title: "Hormoonbalans reset",
          type: "Programma",
          date: "Juli 2025",
          location: "Online",
          spots: 20,
          accentBg: C.vermilionMist,
          accentColor: C.vermilion,
          dot: C.vermilion,
          tag: "Nieuw",
        },
      ];

      // ── Header ────────────────────────────────────────────────────
      const Header = ({ page, setPage }) => (
        <header
          style={{
            background: "#fff",
            borderBottom: `1px solid ${C.border}`,
            position: "sticky",
            top: 0,
            zIndex: 100,
          }}
        >
          <div
            style={{
              maxWidth: 1100,
              margin: "0 auto",
              padding: "0 32px",
              height: 60,
              display: "flex",
              alignItems: "center",
              gap: 32,
            }}
          >
            {/* Logo */}
            <button
              onClick={() => setPage("home")}
              style={{
                background: "none",
                border: "none",
                display: "flex",
                alignItems: "center",
                gap: 8,
                padding: 0,
              }}
            >
              <div
                style={{
                  width: 28,
                  height: 28,
                  borderRadius: "50%",
                  background: C.amber,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                }}
              >
                <div
                  style={{
                    width: 10,
                    height: 10,
                    borderRadius: "50%",
                    background: "#fff",
                  }}
                ></div>
              </div>
              <span
                style={{
                  fontFamily: "Urbanist",
                  fontWeight: 700,
                  fontSize: 16,
                  color: C.charcoal,
                  letterSpacing: "-0.01em",
                }}
              >
                De Menstruatie<span style={{ color: C.blushDark }}>School</span>
              </span>
            </button>
            {/* Nav */}
            <nav style={{ display: "flex", gap: 2, flex: 1 }}>
              {[
                ["Workshops", "workshops"],
                ["Over ons", "about"],
                ["Kennis", "kennis"],
              ].map(([l, p]) => (
                <button
                  key={p}
                  onClick={() => setPage(p)}
                  style={{
                    background: page === p ? C.amberMist : "none",
                    color: page === p ? C.amberDark : C.muted,
                    border: "none",
                    padding: "6px 14px",
                    borderRadius: 20,
                    fontFamily: "Barlow",
                    fontWeight: 300,
                    fontSize: 14,
                    letterSpacing: "0.02em",
                    transition: "all 0.2s ease",
                  }}
                >
                  {l}
                </button>
              ))}
            </nav>
            <button
              onClick={() => setPage("workshops")}
              style={{
                background: C.charcoal,
                color: "#fff",
                border: "none",
                fontFamily: "Barlow",
                fontWeight: 300,
                fontSize: 13,
                letterSpacing: "0.06em",
                padding: "8px 20px",
                borderRadius: 20,
              }}
            >
              Aanmelden
            </button>
          </div>
        </header>
      );

      // ── Hero ──────────────────────────────────────────────────────
      const Hero = ({ onCTA }) => (
        <section
          style={{
            background: "#fff",
            padding: "72px 32px 80px",
            borderBottom: `1px solid ${C.border}`,
          }}
        >
          <div
            style={{
              maxWidth: 1100,
              margin: "0 auto",
              display: "grid",
              gridTemplateColumns: "1fr 1fr",
              gap: 64,
              alignItems: "center",
            }}
          >
            <div>
              <div
                style={{
                  display: "inline-flex",
                  alignItems: "center",
                  gap: 8,
                  background: C.amberMist,
                  borderRadius: 20,
                  padding: "5px 14px",
                  marginBottom: 24,
                }}
              >
                <div
                  style={{
                    width: 6,
                    height: 6,
                    borderRadius: "50%",
                    background: C.amber,
                  }}
                ></div>
                <span
                  style={{
                    fontFamily: "Barlow",
                    fontWeight: 300,
                    fontSize: 12,
                    letterSpacing: "0.12em",
                    textTransform: "uppercase",
                    color: C.amberDark,
                  }}
                >
                  Laagdrempelig · In je buurt
                </span>
              </div>
              <h1
                style={{
                  fontFamily: "Urbanist",
                  fontWeight: 700,
                  fontSize: 52,
                  lineHeight: 1.05,
                  letterSpacing: "-0.025em",
                  color: C.charcoal,
                  marginBottom: 20,
                }}
              >
                Leer je
                <br />
                <em style={{ fontStyle: "italic", color: C.blushDark }}>
                  eigen cyclus
                </em>
                <br />
                begrijpen.
              </h1>
              <p
                style={{
                  fontFamily: "RedHatText",
                  fontSize: 17,
                  lineHeight: 1.75,
                  color: C.muted,
                  marginBottom: 32,
                  maxWidth: 440,
                }}
              >
                Kwalitatieve workshops over de menstruatiecyclus — toegankelijk,
                zonder taboe, en in je eigen buurt.
              </p>
              <div
                style={{
                  display: "flex",
                  gap: 12,
                  flexWrap: "wrap",
                  marginBottom: 48,
                }}
              >
                <button
                  onClick={onCTA}
                  style={{
                    background: C.amber,
                    color: C.charcoal,
                    border: "none",
                    fontFamily: "Barlow",
                    fontWeight: 300,
                    fontSize: 14,
                    letterSpacing: "0.06em",
                    padding: "12px 28px",
                    borderRadius: 24,
                  }}
                >
                  Bekijk workshops
                </button>
                <button
                  style={{
                    background: "none",
                    color: C.charcoal,
                    border: `1.5px solid ${C.border}`,
                    fontFamily: "Barlow",
                    fontWeight: 300,
                    fontSize: 14,
                    letterSpacing: "0.06em",
                    padding: "11px 28px",
                    borderRadius: 24,
                  }}
                >
                  Meer over ons
                </button>
              </div>
              <div style={{ display: "flex", gap: 32 }}>
                {[
                  ["2.400", "dagen menstrueert een vrouw gemiddeld", C.amber],
                  ["80%", "ervaart hormoongerelateerde klachten", C.blush],
                ].map(([n, l, col]) => (
                  <div key={n}>
                    <div
                      style={{
                        fontFamily: "Urbanist",
                        fontWeight: 700,
                        fontSize: 28,
                        color: col,
                        lineHeight: 1,
                      }}
                    >
                      {n}
                    </div>
                    <div
                      style={{
                        fontFamily: "Barlow",
                        fontWeight: 300,
                        fontSize: 12,
                        color: C.muted,
                        marginTop: 4,
                        lineHeight: 1.4,
                        maxWidth: 120,
                      }}
                    >
                      {l}
                    </div>
                  </div>
                ))}
              </div>
            </div>
            {/* Photo placeholder */}
            <div style={{ position: "relative" }}>
              <div
                style={{
                  borderRadius: 20,
                  overflow: "hidden",
                  background: C.amberMist,
                  aspectRatio: "4/5",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  border: `1px solid #F0D888`,
                }}
              >
                <div style={{ textAlign: "center", padding: 32 }}>
                  <div
                    style={{
                      width: 64,
                      height: 64,
                      borderRadius: "50%",
                      background: C.amber,
                      opacity: 0.3,
                      margin: "0 auto 16px",
                    }}
                  ></div>
                  <div
                    style={{
                      fontFamily: "Barlow",
                      fontWeight: 300,
                      fontSize: 12,
                      color: "#ccc",
                      letterSpacing: "0.08em",
                      textTransform: "uppercase",
                    }}
                  >
                    Foto · 4:5
                  </div>
                </div>
              </div>
              {/* Floating stat card */}
              <div
                style={{
                  position: "absolute",
                  bottom: -20,
                  left: -20,
                  background: "#fff",
                  borderRadius: 14,
                  padding: "16px 20px",
                  boxShadow: "0 4px 24px rgba(26,20,16,0.10)",
                  border: `1px solid ${C.border}`,
                }}
              >
                <div
                  style={{
                    fontFamily: "Urbanist",
                    fontWeight: 700,
                    fontSize: 24,
                    color: C.charcoal,
                  }}
                >
                  6,5 jaar
                </div>
                <div
                  style={{
                    fontFamily: "Barlow",
                    fontWeight: 300,
                    fontSize: 12,
                    color: C.muted,
                    marginTop: 2,
                  }}
                >
                  gemiddeld per vrouw
                </div>
              </div>
              {/* Blush accent blob */}
              <div
                style={{
                  position: "absolute",
                  top: -16,
                  right: -16,
                  width: 56,
                  height: 56,
                  borderRadius: "50%",
                  background: C.blush,
                  opacity: 0.25,
                }}
              ></div>
            </div>
          </div>
        </section>
      );

      // ── Workshop Card ─────────────────────────────────────────────
      const WorkshopCard = ({ w, onSelect }) => (
        <div
          onClick={() => onSelect(w)}
          style={{
            background: "#fff",
            borderRadius: 12,
            border: `1px solid ${C.border}`,
            borderTop: `3px solid ${w.dot === "#ccc" ? C.border : w.dot}`,
            padding: "20px",
            cursor: "pointer",
            transition: "box-shadow 0.2s ease, transform 0.2s ease",
            display: "flex",
            flexDirection: "column",
            gap: 12,
          }}
          onMouseEnter={(e) => {
            e.currentTarget.style.boxShadow = "0 4px 20px rgba(26,20,16,0.10)";
            e.currentTarget.style.transform = "translateY(-2px)";
          }}
          onMouseLeave={(e) => {
            e.currentTarget.style.boxShadow = "none";
            e.currentTarget.style.transform = "translateY(0)";
          }}
        >
          <div
            style={{
              display: "flex",
              justifyContent: "space-between",
              alignItems: "flex-start",
            }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <div
                style={{
                  width: 8,
                  height: 8,
                  borderRadius: "50%",
                  background: w.dot,
                  flexShrink: 0,
                }}
              ></div>
              <span
                style={{
                  fontFamily: "Barlow",
                  fontWeight: 300,
                  fontSize: 11,
                  letterSpacing: "0.10em",
                  textTransform: "uppercase",
                  color: C.muted,
                }}
              >
                {w.type}
              </span>
            </div>
            <span
              style={{
                fontFamily: "Barlow",
                fontWeight: 300,
                fontSize: 11,
                background: w.accentBg,
                color: w.accentColor,
                padding: "3px 10px",
                borderRadius: 999,
              }}
            >
              {w.tag}
            </span>
          </div>
          <div
            style={{
              fontFamily: "Urbanist",
              fontWeight: 700,
              fontSize: 18,
              lineHeight: 1.15,
              color: C.charcoal,
            }}
          >
            {w.title}
          </div>
          <div
            style={{
              fontFamily: "Barlow",
              fontWeight: 300,
              fontSize: 13,
              color: C.muted,
            }}
          >
            {w.date} · {w.location}
          </div>
          <div style={{ display: "flex", justifyContent: "flex-end" }}>
            <span
              style={{
                fontFamily: "Barlow",
                fontWeight: 300,
                fontSize: 13,
                color: w.accentColor,
              }}
            >
              Meer info →
            </span>
          </div>
        </div>
      );

      // ── Workshop Modal ────────────────────────────────────────────
      const Modal = ({ w, onClose }) => {
        if (!w) return null;
        return (
          <div
            style={{
              position: "fixed",
              inset: 0,
              zIndex: 200,
              background: "rgba(26,20,16,0.45)",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              padding: 24,
              backdropFilter: "blur(4px)",
            }}
            onClick={onClose}
          >
            <div
              style={{
                background: "#fff",
                borderRadius: 20,
                maxWidth: 500,
                width: "100%",
                overflow: "hidden",
                boxShadow: "0 8px 40px rgba(26,20,16,0.18)",
              }}
              onClick={(e) => e.stopPropagation()}
            >
              <div
                style={{
                  background: w.accentBg,
                  padding: "32px 32px 24px",
                  position: "relative",
                }}
              >
                <button
                  onClick={onClose}
                  style={{
                    position: "absolute",
                    top: 16,
                    right: 16,
                    background: C.border,
                    border: "none",
                    borderRadius: "50%",
                    width: 32,
                    height: 32,
                    fontSize: 14,
                    color: C.muted,
                    cursor: "pointer",
                  }}
                >
                  ✕
                </button>
                <div
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 8,
                    marginBottom: 12,
                  }}
                >
                  <div
                    style={{
                      width: 8,
                      height: 8,
                      borderRadius: "50%",
                      background: w.dot,
                    }}
                  ></div>
                  <span
                    style={{
                      fontFamily: "Barlow",
                      fontWeight: 300,
                      fontSize: 11,
                      letterSpacing: "0.10em",
                      textTransform: "uppercase",
                      color: w.accentColor,
                    }}
                  >
                    {w.type}
                  </span>
                </div>
                <div
                  style={{
                    fontFamily: "Urbanist",
                    fontWeight: 700,
                    fontSize: 28,
                    lineHeight: 1.1,
                    color: C.charcoal,
                  }}
                >
                  {w.title}
                </div>
              </div>
              <div style={{ padding: "24px 32px 32px" }}>
                <div
                  style={{
                    fontFamily: "Barlow",
                    fontWeight: 300,
                    fontSize: 12,
                    letterSpacing: "0.10em",
                    textTransform: "uppercase",
                    color: C.muted,
                    marginBottom: 12,
                  }}
                >
                  {w.date} · {w.location}
                </div>
                <p
                  style={{
                    fontFamily: "RedHatText",
                    fontSize: 15,
                    lineHeight: 1.75,
                    color: C.muted,
                    marginBottom: 24,
                  }}
                >
                  Ontdek hoe jouw cyclus je dagelijks leven beïnvloedt. In een
                  kleine groep, veilige sfeer, met toepasbare kennis die je
                  meteen kunt gebruiken.
                </p>
                <div
                  style={{
                    display: "flex",
                    gap: 24,
                    marginBottom: 28,
                    paddingBottom: 24,
                    borderBottom: `1px solid ${C.border}`,
                  }}
                >
                  {[
                    ["Duur", "3 uur"],
                    ["Prijs", "€45"],
                    ["Plekken", w.spots > 0 ? `${w.spots} vrij` : "Volgeboekt"],
                  ].map(([k, v]) => (
                    <div key={k}>
                      <div
                        style={{
                          fontFamily: "Barlow",
                          fontWeight: 300,
                          fontSize: 10,
                          letterSpacing: "0.14em",
                          textTransform: "uppercase",
                          color: "#ccc",
                          marginBottom: 3,
                        }}
                      >
                        {k}
                      </div>
                      <div
                        style={{
                          fontFamily: "Urbanist",
                          fontWeight: 700,
                          fontSize: 20,
                          color: C.charcoal,
                        }}
                      >
                        {v}
                      </div>
                    </div>
                  ))}
                </div>
                <button
                  style={{
                    width: "100%",
                    background: w.spots > 0 ? C.amber : C.border,
                    color: w.spots > 0 ? C.charcoal : C.muted,
                    border: "none",
                    fontFamily: "Barlow",
                    fontWeight: 300,
                    fontSize: 14,
                    letterSpacing: "0.06em",
                    padding: "14px",
                    borderRadius: 24,
                    cursor: w.spots > 0 ? "pointer" : "not-allowed",
                  }}
                >
                  {w.spots > 0
                    ? "Aanmelden voor deze workshop"
                    : "Volgeboekt — zet me op de wachtlijst"}
                </button>
              </div>
            </div>
          </div>
        );
      };

      // ── About section ─────────────────────────────────────────────
      const AboutSection = () => (
        <section
          style={{
            background: C.offWhite,
            padding: "80px 32px",
            borderTop: `1px solid ${C.border}`,
            borderBottom: `1px solid ${C.border}`,
          }}
        >
          <div style={{ maxWidth: 1100, margin: "0 auto" }}>
            <div
              style={{
                fontFamily: "Barlow",
                fontWeight: 300,
                fontSize: 11,
                letterSpacing: "0.18em",
                textTransform: "uppercase",
                color: C.muted,
                marginBottom: 16,
              }}
            >
              Onze missie
            </div>
            <div
              style={{
                display: "grid",
                gridTemplateColumns: "1fr 1fr",
                gap: 64,
                alignItems: "start",
              }}
            >
              <div>
                <h2
                  style={{
                    fontFamily: "Urbanist",
                    fontWeight: 700,
                    fontSize: 38,
                    lineHeight: 1.1,
                    letterSpacing: "-0.02em",
                    color: C.charcoal,
                    marginBottom: 20,
                  }}
                >
                  Kennis die jou in je kracht zet
                </h2>
                <p
                  style={{
                    fontFamily: "RedHatText",
                    fontSize: 16,
                    lineHeight: 1.75,
                    color: C.muted,
                    marginBottom: 16,
                  }}
                >
                  Een groot deel van de last die menstruerende personen ervaren
                  blijft onnodig lang onzichtbaar — door taboe, een gebrek aan
                  kwalitatieve educatie en het normaliseren van klachten.
                </p>
                <p
                  style={{
                    fontFamily: "RedHatText",
                    fontSize: 16,
                    lineHeight: 1.75,
                    color: C.muted,
                  }}
                >
                  Met De MenstruatieSchool bieden we toepasbare kennis die
                  taboes doorbreekt. Op korte termijn meer rust en
                  zelfvertrouwen. Op lange termijn betere gezondheid en
                  emancipatie.
                </p>
              </div>
              <div
                style={{ display: "flex", flexDirection: "column", gap: 12 }}
              >
                {[
                  [
                    "Laagdrempelig",
                    "Workshops in je eigen buurt, voor iedereen.",
                    C.amber,
                    C.amberMist,
                  ],
                  [
                    "Kwalitatief",
                    "Onderbouwde kennis, geen hype of taboe.",
                    C.blush,
                    C.blushMist,
                  ],
                  [
                    "Verbindend",
                    "Meer taal, meer begrip, meer ruimte voor steun.",
                    C.vermilion,
                    C.vermilionMist,
                  ],
                ].map(([title, sub, dot, bg]) => (
                  <div
                    key={title}
                    style={{
                      background: "#fff",
                      borderRadius: 10,
                      padding: "18px 20px",
                      border: `1px solid ${C.border}`,
                      borderLeft: `3px solid ${dot}`,
                      display: "flex",
                      gap: 14,
                      alignItems: "flex-start",
                    }}
                  >
                    <div
                      style={{
                        width: 10,
                        height: 10,
                        borderRadius: "50%",
                        background: dot,
                        marginTop: 6,
                        flexShrink: 0,
